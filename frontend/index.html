<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <title>App</title>
  <script>
    // Best-effort: apply the last-known admin-configured app name/favicon
    // before React mounts, so repeat visits don't flash the default title/icon.
    // SettingsContext refreshes this cache on every successful /settings fetch.
    (function () {
      try {
        var cached = JSON.parse(localStorage.getItem("cachedBranding") || "null");
        if (cached) {
          if (cached.metaTitle || cached.appName) {
            document.title = cached.metaTitle || cached.appName;
          }
          if (cached.faviconUrl) {
            var link = document.querySelector('link[rel="icon"]');
            if (link) link.href = cached.faviconUrl;
          }
        }
      } catch (e) {
        // ignore — defaults above already apply
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
